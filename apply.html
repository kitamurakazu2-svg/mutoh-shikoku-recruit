<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Webで簡単応募｜株式会社ムトウ四国</title><link rel='stylesheet' href='style.css'><style>
html{scroll-behavior:smooth}body{overflow-x:hidden}

 body{font-size:15px;line-height:1.6}
 .hero-image{width:100%!important;height:auto!important;max-height:300px!important;object-fit:contain!important;background:#fff}
 .hero-copy{padding:14px 14px 20px!important}
 .hero-copy h1{font-size:24px!important;line-height:1.35!important;margin-bottom:7px!important}
 .hero-copy p{font-size:14px!important;line-height:1.6!important;margin-bottom:10px!important}
 .badges{gap:6px!important;margin:10px 0 15px!important}

 .primary{width:100%;padding:13px 12px!important;font-size:16px!important}
 main{padding:0 10px 20px!important}
 section{margin:14px 0!important;padding:16px 12px!important;border-radius:15px!important}
 h2{font-size:22px!important;margin-bottom:14px!important}
 .jobs{grid-template-columns:1fr!important;gap:14px!important}
 .job{padding:12px!important;border-radius:15px!important}
 .job-photos{display:grid!important;grid-template-columns:1fr 1fr!important;gap:5px!important;margin:0 0 11px!important}
 .job-photos img{width:100%!important;height:112px!important;object-fit:cover!important;border-radius:9px!important}
 .job h3{font-size:18px!important;line-height:1.45!important;margin:9px 0 5px!important}
 .job .pay{font-size:19px!important;margin:5px 0!important}
 .job p{margin:6px 0!important;font-size:14px!important}
 .job a{padding:12px 10px!important;margin-top:9px!important;width:100%!important;text-align:center}
 .details{grid-template-columns:1fr!important;gap:2px!important}
 .actions{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}
 .actions a,.actions button{width:100%!important;text-align:center}
 input,select,textarea{font-size:16px!important}
 footer{font-size:12px!important;padding:22px 10px!important}
}

.application-job-image{margin:14px 0 18px}
.application-job-image img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:14px}
.application-job-image p{margin:7px 0 0;font-weight:700;color:#063c91;text-align:center}
input[type=file]{padding:10px;background:#fff}

@media(max-width:650px){}

/* Ver.12 応募フォーム：1項目1段で表示 */
form label{
  display:block !important;
  width:100% !important;
  margin-top:18px !important;
  margin-bottom:7px !important;
  font-weight:700;
}
form input,
form select,
form textarea{
  display:block !important;

</style></head><body><main><section><h1>Webで簡単応募</h1><p>入力は1〜2分程度。メールアドレスは任意です。</p>
<div id="application-job-image" class="application-job-image" hidden>
  <img src="assets/chuo-work1.jpeg" alt="徳島県立中央病院の職場風景">
  <p>徳島県立中央病院｜職場風景</p>
</div>
<form action="https://formspree.io/f/mjykljeq" method="POST">
<input type="hidden" name="_subject" value="【ムトウ四国求人サイト】新しい応募がありました">
<input type="hidden" name="_language" value="ja">
<label>希望求人</label><select id="job" name="希望求人">
<option value="徳島県立中央病院" data-code="chuo">徳島県立中央病院｜医療器材の洗浄・組立等</option>
<option value="徳島県立海部病院" data-code="kaifu">徳島県立海部病院｜診療材料の院内搬送・管理</option>
</select><label>お名前 *</label><input required name='name'><label>電話番号 *</label><input required inputmode='tel' name='tel'><label>メールアドレス（任意）</label><input type='email' name="email">

<label>連絡希望時間帯（任意）</label><select name="連絡希望時間帯"><option>いつでも可</option><option>9〜12時</option><option>12〜16時</option><option>16時以降</option></select><label>自由記入欄（任意）</label><textarea rows='4' name="自由記入欄"></textarea><p><label><input style='width:auto' type='checkbox' required> <a href='privacy.html'>プライバシーポリシー</a>を確認し、個人情報の取扱いに同意します。</label></p><div class='actions'><button type="submit">応募内容を送信</button></div><p class='note'>※送信テスト中です。応募内容はFormspree経由で通知されます。</p></form></section></main>
<script src="recruit-config.js"></script>
<script>
const jobSelect = document.getElementById('job');
const jobImage = document.getElementById('application-job-image');

function getSelectedJobCode() {
  return jobSelect?.options[jobSelect.selectedIndex]?.dataset.code || '';
}

function applyRequestedJobFromUrl() {
  const requestedJob = new URLSearchParams(location.search).get('job');
  if (!requestedJob || !jobSelect) return;
  [...jobSelect.options].forEach((opt, index) => {
    if (opt.dataset.code === requestedJob) jobSelect.selectedIndex = index;
  });
}

function filterInactiveJobs() {
  if (!jobSelect) return;
  [...jobSelect.options].forEach(opt => {
    const code = opt.dataset.code;
    const cfg = window.RECRUIT_CONFIG?.jobs?.[code];
    if (cfg && cfg.active === false) opt.remove();
  });
}

function updateApplicationImage() {
  if (!jobSelect || !jobImage) return;
  jobImage.hidden = getSelectedJobCode() !== 'chuo';
}

filterInactiveJobs();
applyRequestedJobFromUrl();
updateApplicationImage();
jobSelect?.addEventListener('change', updateApplicationImage);
</script>
<!-- Formspree connected: https://formspree.io/f/mjykljeq -->
</body></html>
